name: nimc_agent_app
description: NIMC/NIBSS Biometric Enrollment Agent Application — Android, Windows & Linux desktop
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # HTTP & API
  dio: ^5.7.0

  # Secure storage
  flutter_secure_storage: ^9.2.2

  # Local DB for offline queue
  sqflite: ^2.3.3
  path: ^1.9.0

  # Camera
  camera: ^0.11.0

  # GPS / Location
  geolocator: ^13.0.1

  # NTP Time sync
  ntp: ^2.0.0

  # Crypto / Hashing (device fingerprint)
  crypto: ^3.0.3

  # Device Info
  device_info_plus: ^10.1.2
  network_info_plus: ^6.0.1

  # UI extras
  flutter_animate: ^4.5.0
  fl_chart: ^0.69.0
  google_fonts: ^6.2.1
  shimmer: ^3.0.0

  # Utils
  intl: ^0.19.0
  uuid: ^4.4.2
  permission_handler: ^11.3.1
  connectivity_plus: ^6.1.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
