name: biosecure_agent_app
description: Ufriends BioSecure — Biometric Enrollment Agent Application (Android, Windows & Linux)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # HTTP & API
  dio: ^5.7.0

  # Secure storage
  flutter_secure_storage: ^9.2.2

  # Local DB for offline queue
  sqflite: ^2.3.3
  path: ^1.9.0

  # Camera
  camera: ^0.11.0

  # ML Kit — on-device face detection (offline)
  google_mlkit_face_detection: ^0.11.0

  # GPS / Location
  geolocator: ^13.0.1

  # NTP Time sync
  ntp: ^2.0.0

  # Crypto / Hashing (device fingerprint)
  crypto: ^3.0.3

  # Device Info
  device_info_plus: ^10.1.2
  network_info_plus: ^6.0.1

  # UI extras
  flutter_animate: ^4.5.0
  fl_chart: ^0.69.0
  google_fonts: ^6.2.1
  shimmer: ^3.0.0

  # Utils
  intl: ^0.19.0
  uuid: ^4.4.2
  permission_handler: ^11.3.1
  connectivity_plus: ^6.1.0

  # mDNS — auto-discover backend server regardless of IP changes
  multicast_dns: ^0.3.2+1
  shared_preferences: ^2.3.2

  # Gyroscope & accelerometer — behavioral telemetry (blueprint §4.1)
  sensors_plus: ^6.1.1

  # Image processing — palm vein feature extraction (blueprint: OpenCV pipeline)
  image: ^4.2.0

  # TFLite — MediaPipe hand landmark model (21 keypoints, lighting-independent geometry)
  # v0.10.4 patched for Dart 3.x + JVM-17 (see pub-cache patches applied above)
  tflite_flutter: ^0.12.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/hand_landmark.tflite
